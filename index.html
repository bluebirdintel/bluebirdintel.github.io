<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Birdhouse</title>
<style>
  :root { --accent: #7fb8ec; }
  html, body { margin: 0; height: 100%; background: #000; color: #e3edf7;
    font-family: system-ui, -apple-system, sans-serif; }
  #sky { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; z-index: 0; }

  /* ===== Intro ===== */
  #intro { position: fixed; inset: 0; z-index: 10; background: #000;
    transition: opacity .8s ease; cursor: pointer; }
  #intro.done { opacity: 0; pointer-events: none; }
  #intro canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #intro::after { content: ""; position: absolute; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(0deg, rgba(0,0,0,.25) 0 1px, transparent 1px 3px); }
  #intro .skip { position: absolute; bottom: 18px; left: 0; right: 0; text-align: center;
    color: #2d5f96; font: 12px ui-monospace, Menlo, monospace; letter-spacing: .25em; z-index: 1; }
  main { position: relative; z-index: 1; min-height: 100vh; display: flex;
    align-items: center; justify-content: center; padding: 16px; box-sizing: border-box; }
  .card { max-width: 560px; width: 100%; background: rgba(0,0,0,.75);
    border: 1px solid rgba(127,184,236,.45); border-radius: 14px; padding: 28px;
    box-sizing: border-box; text-align: center; box-shadow: 0 0 40px rgba(127,184,236,.15); }
  h1 { margin: 0 0 10px; color: var(--accent); font-family: ui-monospace, Menlo, monospace;
    letter-spacing: .06em; }
  p { line-height: 1.6; margin: 0 0 12px; }
  a { color: var(--accent); }
</style>
</head>
<body>
<div id="intro" aria-hidden="true">
  <canvas id="introCanvas"></canvas>
  <div class="skip">TAP TO SKIP</div>
</div>

<canvas id="sky" aria-hidden="true"></canvas>

<main>
  <div class="card">
    <h1>Bluebird_Intel</h1>
    <p>Welcome to the birdhouse. Official home and portfolio of Bluebird_Intel</p>
    <p><a href="mailto:bluebirdintel@proton.me">Contact</a></p>
    <p><a href="works.html">My Work</a></p>

    <p style="font-size:13px;color:#8fa3bd;margin:16px 0 0;">© 2026 Bluebird Intel LLC</p>
  </div>
</main>

  
<script src="sky.js"></script>
<script src="intro.js"></script>
</body>
</html>
