<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Site</title>
<style>
  :root { --lav: #c8a2e8; }
  html, body { margin: 0; height: 100%; background: #000; color: #e8e0f0;
    font-family: system-ui, -apple-system, sans-serif; }
  #swirl { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; z-index: 0; }

  /* ===== Intro ===== */
  #intro { position: fixed; inset: 0; z-index: 10; background: #000;
    transition: opacity .8s ease; cursor: pointer; }
  #intro.done { opacity: 0; pointer-events: none; }
  #intro canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #intro::after { content: ""; position: absolute; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(0deg, rgba(0,0,0,.25) 0 1px, transparent 1px 3px); }
  #intro .skip { position: absolute; bottom: 18px; left: 0; right: 0; text-align: center;
    color: #2d5f96; font: 12px ui-monospace, Menlo, monospace; letter-spacing: .25em; z-index: 1; }
  main { position: relative; z-index: 1; min-height: 100vh; display: flex;
    align-items: center; justify-content: center; padding: 16px; box-sizing: border-box; }
  .card { max-width: 560px; width: 100%; background: rgba(0,0,0,.75);
    border: 1px solid rgba(200,162,232,.45); border-radius: 14px; padding: 28px;
    box-sizing: border-box; text-align: center; box-shadow: 0 0 40px rgba(200,162,232,.15); }
  h1 { margin: 0 0 10px; color: var(--lav); font-family: ui-monospace, Menlo, monospace;
    letter-spacing: .06em; }
  p { line-height: 1.6; margin: 0 0 12px; }
  a { color: var(--lav); }
</style>
</head>
<body>
<div id="intro" aria-hidden="true">
  <canvas id="introCanvas"></canvas>
  <div class="skip">TAP TO SKIP</div>
</div>

<canvas id="swirl" aria-hidden="true"></canvas>

<main>
  <div class="card">
    <h1>Your Name</h1>
    <p>This is your site. Edit this text in index.html — everything here is yours.</p>
    <p><a href="mailto:you@example.com">Contact</a></p>
  </div>
</main>

<script>
/* ===== Swirl settings — tweak these ===== */
const CHARS   = ' .,:;-~=+*o#%@'; // dim -> bright
const FONT_PX = 14;   // character size (smaller = finer detail, more work)
const ARMS    = 4;    // number of spiral arms
const TWIST   = 22;   // how tightly the arms wind
const SPEED   = 0.6;  // rotation speed (radians/sec); positive = counterclockwise
const FPS     = 30;
/* ======================================= */

const canvas = document.getElementById('swirl');
const ctx = canvas.getContext('2d');

// Palette: black-purple -> lavender -> pale lavender, one color per character
function mix(a, b, t) { return a.map((v, i) => Math.round(v + (b[i] - v) * t)); }
const DARK = [40, 18, 60], LAV = [200, 162, 232], PALE = [240, 228, 252];
const PALETTE = [...CHARS].map((_, i) => {
  const t = i / (CHARS.length - 1);
  const c = t < 0.7 ? mix(DARK, LAV, t / 0.7) : mix(LAV, PALE, (t - 0.7) / 0.3);
  return `rgb(${c[0]},${c[1]},${c[2]})`;
});

let W, H, cols, rows, cw, ch, theta, radius;

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  canvas.width = W * dpr; canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.font = `${FONT_PX}px ui-monospace, Menlo, monospace`;
  ctx.textBaseline = 'top';
  cw = ctx.measureText('M').width; ch = FONT_PX;
  cols = Math.ceil(W / cw); rows = Math.ceil(H / ch);

  // Precompute polar coords for each cell (y flipped so angles are math-style)
  const n = cols * rows, minDim = Math.min(W, H);
  theta = new Float32Array(n); radius = new Float32Array(n);
  for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) {
    const dx = (x + 0.5) * cw - W / 2;
    const dy = H / 2 - (y + 0.5) * ch;
    const i = y * cols + x;
    theta[i] = Math.atan2(dy, dx);
    radius[i] = Math.hypot(dx, dy) / minDim;
  }
}

function draw(t) {
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);
  const last = CHARS.length - 1;
  for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) {
    const i = y * cols + x;
    // Pattern f(theta - SPEED*t) rotates counterclockwise as t grows
    const v = Math.sin(ARMS * (theta[i] - SPEED * t) + TWIST * radius[i]);
    let b = (v + 1) / 2;
    b = b * b * Math.min(1, radius[i] * 6 + 0.2); // soften the very center
    const idx = Math.round(b * last);
    if (idx === 0) continue;
    ctx.fillStyle = PALETTE[idx];
    ctx.fillText(CHARS[idx], x * cw, y * ch);
  }
}

let lastFrame = 0;
function loop(ms) {
  if (ms - lastFrame >= 1000 / FPS) { lastFrame = ms; draw(ms / 1000); }
  requestAnimationFrame(loop);
}

addEventListener('resize', resize);
resize();
if (matchMedia('(prefers-reduced-motion: reduce)').matches) draw(0);
else requestAnimationFrame(loop);
</script>

<script>
/* ===== Intro: ASCII bird bombing run -> explosion -> site ===== */
(() => {
  const intro = document.getElementById('intro');
  let seen = false;
  try { seen = sessionStorage.getItem('introSeen') === '1'; } catch (e) {}
  if (seen || matchMedia('(prefers-reduced-motion: reduce)').matches) { intro.remove(); return; }
  try { sessionStorage.setItem('introSeen', '1'); } catch (e) {}

  const cv = document.getElementById('introCanvas');
  const g = cv.getContext('2d');
  const BLUE = '#3fa9f5', DEEP = '#1b4f8a', LAV = '#c8a2e8', WHITE = '#eaf4ff';
  const FONT = 'ui-monospace, Menlo, monospace';

  // Bird sprite, redrawn from the bluebird_intel logo: round body, tuft, glasses, >_ eyes
  const BODY = [
    '      _,',
    "  .-'` /`-.",
    ' / .---. .---.',
    '-|-|>_ |=|>_ |',
    " | '---' '---'>",
    ' |           |',
    '  \\         /',
    "   '-.___.-'",
    '     ,, ,,'
  ];
  // Color mask: B body blue, W glasses, E green >_ eyes, O orange beak/feet
  const MASK = [
    '      BB',
    '  BBBBBBBBB',
    ' B WWWWW WWWWW',
    'WBWWEE WWWEE W',
    ' B WWWWW WWWWWO',
    ' B           B',
    '  B         B',
    '   BBBBBBBBB',
    '     OO OO'
  ];
  const WING_UP   = { row: 1, rows: ['\\\\', ' \\\\\\', '  \\\\'] };
  const WING_DOWN = { row: 4, rows: ['  //', ' ///', '//'] };
  const INK = { B: '#6ba3d6', W: '#d7dde6', E: '#5fbf3a', O: '#f0b060', D: '#4f86c6' };
  const WING_COLS = 4, SPRITE_COLS = WING_COLS + 15;

  function drawBird(x, y, flapUp) {
    const top = y - 4 * FS;
    BODY.forEach((row, r) => {
      for (let i = 0; i < row.length; i++) {
        const c = row[i];
        if (c === ' ') continue;
        g.fillStyle = INK[MASK[r][i]] || INK.B;
        g.fillText(c, x + (WING_COLS + i) * cw, top + r * FS);
      }
    });
    const w = flapUp ? WING_UP : WING_DOWN;
    g.fillStyle = INK.D;
    w.rows.forEach((row, k) => g.fillText(row, x, top + (w.row + k) * FS));
  }

  let W, H, FS, cw;
  function size() {
    const dpr = Math.min(devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    FS = Math.max(12, Math.min(20, W / 34));
    g.font = `bold ${FS}px ${FONT}`;
    cw = g.measureText('M').width;
  }
  size(); addEventListener('resize', size);
  g.textBaseline = 'top';

  const BIRD_START = 0.9, CROSS = 3.4;     // seconds
  const TITLE = '> bluebird_intel';
  const bombs = [], parts = [];
  let t = 0, prev = null, lastDrop = 0, bigDropped = false;
  let boomAt = null, boomX = 0, boomY = 0, ringR = 0, flash = 0, finished = false;

  const groundY = () => H * 0.82;
  function bird(time) {
    const p = (time - BIRD_START) / CROSS, sw = SPRITE_COLS * cw;
    return { p, x: -sw + p * (W + sw * 2), y: H * 0.26 + Math.sin(p * Math.PI * 3) * H * 0.03 };
  }

  function burst(x, y, n, speed, chars, cols, up) {
    for (let i = 0; i < n; i++) {
      const a = up ? -Math.PI * (0.1 + Math.random() * 0.8) : Math.random() * Math.PI * 2;
      const s = speed * (0.3 + Math.random() * 0.7);
      const life = 0.5 + Math.random() * 0.9;
      parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life, max: life,
        ch: chars[(Math.random() * chars.length) | 0], col: cols[(Math.random() * cols.length) | 0] });
    }
  }

  function finish() {
    if (finished) return;
    finished = true;
    intro.classList.add('done');
    setTimeout(() => intro.remove(), 900);
  }
  intro.addEventListener('pointerdown', finish);
  addEventListener('keydown', finish, { once: true });

  function step(ms) {
    if (finished) return;
    if (prev === null) prev = ms;
    const dt = Math.min(0.05, (ms - prev) / 1000); prev = ms; t += dt;

    // --- update ---
    const b = bird(t);
    if (b.p > 0.05 && b.p < 0.95 && !bigDropped && t - lastDrop > 0.4) {
      lastDrop = t;
      bombs.push({ x: b.x + 11 * cw, y: b.y + 5 * FS, vx: 60, vy: 0, big: false });
    }
    if (!bigDropped && b.p >= 0.5) {
      bigDropped = true;
      bombs.push({ x: b.x + 11 * cw, y: b.y + 5 * FS, vx: 30, vy: 0, big: true });
    }
    for (let i = bombs.length - 1; i >= 0; i--) {
      const m = bombs[i];
      m.vy += H * 1.4 * dt; m.x += m.vx * dt; m.y += m.vy * dt;
      if (m.big && m.y >= H * 0.55) {
        bombs.splice(i, 1);
        boomAt = t; flash = 1; boomX = m.x; boomY = m.y;
        burst(m.x, m.y, 450, Math.max(W, H) * 1.1, '@#%*+=-:.', [BLUE, LAV, WHITE, LAV], false);
      } else if (!m.big && m.y >= groundY()) {
        bombs.splice(i, 1);
        burst(m.x, groundY(), 22, H * 0.5, "*+x.'", [BLUE, LAV, WHITE], true);
      }
    }
    for (let i = parts.length - 1; i >= 0; i--) {
      const q = parts[i];
      q.x += q.vx * dt; q.y += q.vy * dt; q.vy += H * 0.6 * dt; q.vx *= 0.985;
      q.life -= dt;
      if (q.life <= 0) parts.splice(i, 1);
    }
    if (boomAt !== null) { ringR += Math.max(W, H) * 1.6 * dt; flash = Math.max(0, flash - dt * 2.5); }
    if ((boomAt !== null && t - boomAt > 0.9) || t > 9) finish();

    // --- draw ---
    g.globalAlpha = 1;
    g.fillStyle = '#000'; g.fillRect(0, 0, W, H);

    // typed terminal title
    g.font = `bold ${Math.max(12, FS * 0.7)}px ${FONT}`;
    g.fillStyle = BLUE;
    const typed = TITLE.slice(0, Math.floor(Math.min(1, t / 0.7) * TITLE.length));
    const cursor = Math.floor(t * 3) % 2 ? '_' : ' ';
    g.fillText(typed + cursor, 16, 16);

    g.font = `bold ${FS}px ${FONT}`;

    // ground
    g.fillStyle = DEEP;
    g.fillText('_'.repeat(Math.ceil(W / cw)), 0, groundY());

    // bombs
    for (const m of bombs) {
      g.fillStyle = m.big ? WHITE : LAV;
      g.fillText(m.big ? '(@)' : '@', m.x - (m.big ? cw : cw / 2), m.y);
    }

    // bird
    if (b.p > 0 && b.p < 1) {
      drawBird(b.x, b.y, Math.floor(t / 0.14) % 2 === 1);
    }

    // particles
    for (const q of parts) {
      g.globalAlpha = Math.max(0, q.life / q.max);
      g.fillStyle = q.col;
      g.fillText(q.ch, q.x, q.y);
    }

    // shockwave ring
    if (boomAt !== null) {
      const cx = boomX, cy = boomY, n = Math.max(12, Math.floor((2 * Math.PI * ringR) / cw));
      g.globalAlpha = Math.max(0, 1 - (t - boomAt) / 0.9);
      g.fillStyle = LAV;
      for (let i = 0; i < n; i++) {
        const a = (i / n) * Math.PI * 2;
        g.fillText('#', cx + Math.cos(a) * ringR, cy + Math.sin(a) * ringR);
      }
    }

    // white flash
    if (flash > 0) { g.globalAlpha = flash * 0.8; g.fillStyle = WHITE; g.fillRect(0, 0, W, H); }
    g.globalAlpha = 1;

    requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
})();
</script>
</body>
</html>
